    Projects:
      - name: gipsDA R library
        url: https://antonikingston.github.io/gipsDA/
        summary: "*An R package for discriminant analysis classification using covariance matrices with permutation symmetries*"
        highlights:
          - "A fully functional R library available on [CRAN](https://cran.r-project.org/web/packages/gipsDA/index.html), developed with best programming practices"
          - Enhances gips by estimating permutation symmetry shared by multiple matrices
          - Provides Linear and Quadratic Discriminant Analysis classifiers utilizing gips methodology
      - name: Tweet Sentiment Predictor
        url: https://github.com/AdamKaniasty/TweetsSentimentPredictor
        summary: "*Binary sentiment classification on 100k Sentiment140 tweets via NLP feature engineering and ensemble ML*"
        highlights:
          - Built a three-stage Jupyter pipeline for feature engineering, selection, and modeling, with reproducible 5-fold cross-validation
          - Engineered lexical, readability, temporal, and embedding features using VADER, TextBlob, Word2Vec, Sentence-BERT, and spaCy
          - Selected predictors with L1 logistic regression and feature_engine; tuned XGBoost, LightGBM, ensembles, and a Keras MLP with Optuna, achieving ~81% cross-validated accuracy
      - name: A Simple GPT model
        url: https://github.com/AntoniKingston/A-Simple-GPT-Model
        summary: "*Generative language model training*"
        highlights:
          - Implemented a causal Transformer language model in PyTorch with attention blocks and RMSNorm
          - Built a custom BPE tokenizer and corpus-to-encoding pipeline; trained on Adam Mickiewicz works and generated text
          - "In progress: scaling training to the Polish Parliamentary Corpus (PPC)"
